model:
  vocab_size: null
  d_model: 256
  lstm_hidden: 256
  lstm_layers: 2
  dropout: 0.1
  pretrained: true
data:
  train_annotation: data/raw/train/labels.txt
  val_annotation: data/raw/val/labels.txt
  train_image_root: .
  val_image_root: .
  image_height: 64
  max_image_width: 512
  max_label_len: 32
  use_elastic: false
  num_workers: 2
training:
  batch_size: 64
  epochs: 50
  lr: 0.0003
  weight_decay: 0.0001
  grad_clip: 5.0
  mixed_precision: true
  log_interval: 50
  val_interval: 1
  save_dir: checkpoints/ctc
  log_dir: logs/ctc
  vocab_path: checkpoints/vocab.pkl
  warmup_steps: 4000
